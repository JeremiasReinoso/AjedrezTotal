<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biblioteca — AjedrezTotal</title><meta name="description" content="Biblioteca editorial de ajedrez con artículos originales de ejemplo."><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/componentes.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html"><span class="brand-mark">♞</span><span>AjedrezTotal</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="menu">☰</button><nav id="menu" class="nav-links" aria-label="Navegación principal"><a href="../index.html">Inicio</a><a href="../entrenadores/index.html">Entrenadores</a><a href="../ejercicios/index.html">Ejercicios</a><a aria-current="page" href="index.html">Biblioteca</a><a href="../torneos/index.html">Torneos</a><a class="button button-primary" href="../incorporar-entrenador/index.html">Sumate</a></nav></div></header><main><section class="page-hero"><div class="container"><p class="eyebrow">Biblioteca editorial</p><h1>Ideas para llevar al tablero.</h1><p>Contenido original de ejemplo, organizado para que puedas leer, practicar y volver a la partida con un plan.</p></div></section><section class="section"><div class="container"><div class="form-grid card card-pad"><div class="field"><label for="buscar-articulo">Buscar</label><input id="buscar-articulo" type="search" placeholder="Buscar por título o tema"></div><div class="field"><label for="categoria-articulo">Categoría</label><select id="categoria-articulo"><option value="">Todas las categorías</option><option>Principios estratégicos</option><option>Táctica</option><option>Finales</option><option>Consejos para principiantes</option></select></div></div><div id="articulos-grid" class="grid-2" style="margin-top:1.5rem"></div></div></section></main><footer class="site-footer"><div class="container footer-bottom">AjedrezTotal · Contenido original de demostración</div></footer><script src="../js/utilidades.js"></script><script src="../js/navegacion.js"></script><script src="../datos/articulos.js"></script><script>
/** Filtra y renderiza artículos locales según la búsqueda y categoría seleccionadas. */
(function () {
	'use strict';
	var articles = AjedrezDatos.articulos || [];
	var articlesGrid = document.querySelector('#articulos-grid');
	var searchInput = document.querySelector('#buscar-articulo');
	var categoryFilter = document.querySelector('#categoria-articulo');

	function renderizarArticulos() {
		var searchTerm = searchInput.value.toLowerCase().trim();
		var filteredArticles = articles.filter(function (article) {
			return (!searchTerm || (article.titulo + ' ' + article.resumen + ' ' + article.categoria)
				.toLowerCase().includes(searchTerm)) &&
				(!categoryFilter.value || article.categoria === categoryFilter.value);
		});
		articlesGrid.innerHTML = filteredArticles.length ?
			filteredArticles.map(function (article) {
				return '<article class="card card-pad"><span class="tag">' +
					AjedrezUI.escape(article.categoria) + '</span><h2>' +
					AjedrezUI.escape(article.titulo) + '</h2><p>' +
					AjedrezUI.escape(article.resumen) + '</p><p class="muted" ' +
					'style="font-size:.85rem">Actualizado ' + AjedrezUI.escape(article.fecha) +
					' · ' + AjedrezUI.escape(article.autor) + '</p><details><summary>Leer artículo</summary>' +
					'<p style="margin-top:1rem">' + AjedrezUI.escape(article.contenido) +
					'</p></details></article>';
			}).join('') :
			'<div class="empty-state" style="grid-column:1/-1"><h3>No encontramos artículos</h3>' +
			'<p>Probá con otra categoría o palabra.</p></div>';
	}

	searchInput.addEventListener('input', renderizarArticulos);
	categoryFilter.addEventListener('change', renderizarArticulos);
	renderizarArticulos();
}());
</script></body></html>
