<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrar crónicas — AjedrezTotal</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/componentes.css"><link rel="stylesheet" href="../css/layout.css"></head><body><main class="section"><div class="container"><p><a href="index.html">← Torneos</a></p><h1>Panel editorial</h1><p class="muted">Esta pantalla usa la sesión real del servidor. El rol administrador se valida en la API; ocultar este enlace no es una medida de seguridad.</p><form id="form" class="card card-pad" style="max-width:760px"><div class="form-grid"><div class="field full"><label>Título<input name="title" required minlength="3"></label></div><div class="field"><label>Tipo<select name="category"><option value="presencial">Presencial</option><option value="online">Online</option><option value="general">General</option></select></label></div><div class="field"><label>Evento<input name="event_name" required></label></div><div class="field"><label>Organizador<input name="organizer" required></label></div><div class="field"><label>Lugar<input name="location"></label></div><div class="field"><label>Fecha<input name="event_date" placeholder="2026-10-20"></label></div><div class="field full"><label>Resumen<textarea name="summary" required minlength="10"></textarea></label></div><div class="field full"><label>Enlace oficial HTTPS<input name="official_url" type="url" placeholder="https://chess-results.com/..."></label></div><div class="field"><label><input name="published" type="checkbox"> Publicar</label></div></div><button class="button button-primary" type="submit">Guardar crónica</button><p id="status" role="status"></p></form></div></main><script>document.querySelector('#form').addEventListener('submit',function(e){e.preventDefault();var f=new FormData(e.currentTarget),data=Object.fromEntries(f.entries());data.published=f.has('published');fetch('../api/torneos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.error);return x;});}).then(function(){document.querySelector('#status').textContent='Crónica guardada.';e.currentTarget.reset();}).catch(function(x){document.querySelector('#status').textContent=x.message;});});</script></body></html>
